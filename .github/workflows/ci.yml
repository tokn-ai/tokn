name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check release version consistency
        run: node --experimental-strip-types scripts/release/check-version.ts

  docker-agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install script dependencies
        run: bun install --cwd scripts --frozen-lockfile
      - name: Check container agent-test TypeScript
        run: bun --cwd scripts check
      - name: Test container agent-test harness without credentials
        run: bun --cwd scripts test

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Check formatting
        run: cargo fmt --all -- --check

  desktop-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Test inspector
        run: pnpm test

      - name: Build desktop frontend
        run: pnpm build

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MODELS_DEV_SNAPSHOT: vendor/models.dev.json
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Check Python Cargo build
        run: cargo build --locked --package tokn-python

      - name: Run tests
        run: cargo test --locked --workspace --all-features

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Build Python wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: "v1.14.1"
          command: build
          args: --release --locked --manifest-path bindings/python/Cargo.toml --out dist

      - name: Check Python stable ABI wheel
        run: |
          python bindings/python/scripts/check_wheel.py dist/*.whl
          python -m pip install abi3audit==0.0.26
          python -m abi3audit --strict --summary dist/*.whl

      - name: Install Python wheel
        run: python -m pip install dist/*.whl

      - name: Test Python SDK
        run: python -m unittest discover -s bindings/python/tests

  typescript:
    name: TypeScript (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    defaults:
      run:
        working-directory: bindings/typescript

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64-node22
            os: ubuntu-latest
            node: 22
          - label: linux-x64-node24
            os: ubuntu-latest
            node: 24
          - label: macos-arm64-node22
            os: macos-15
            node: 22
          - label: windows-x64-node22
            os: windows-latest
            node: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: bindings/typescript/package.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: bindings/typescript/pnpm-lock.yaml

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: typescript

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native binding
        run: pnpm build:native

      - name: Check TypeScript
        run: pnpm check

      - name: Build TypeScript
        run: pnpm build:ts

      - name: Test with Node.js
        run: pnpm test:node

      - name: Test with Bun
        run: pnpm test:bun

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODELS_DEV_SNAPSHOT: vendor/models.dev.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Generate coverage report
        run: >-
          cargo llvm-cov --locked --workspace --all-features
          --ignore-filename-regex 'bindings/(python/src/lib|typescript/native/.*)\.rs'
          --codecov --output-path codecov.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: codecov.json
          use_oidc: true

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Build default Rust workspace
        run: cargo build --locked --all-features

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_NAME: tokn-gateway-cli:ci
      IMAGE_TAR: /tmp/tokn-gateway-cli-image.tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tokn-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ env.IMAGE_TAR }}

      - name: Smoke-test container startup and shutdown
        run: |
          docker load --input "$IMAGE_TAR"
          bash scripts/docker/smoke.sh "$IMAGE_NAME"

      - name: Upload tokn-gateway image artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokn-gateway-cli-image
          path: ${{ env.IMAGE_TAR }}
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

name: Release npm SDK

on:
  push:
    branches:
      - "v0.2.3-sdk"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build; must match VERSION on the selected source ref
        required: true
        default: "0.2.3"
        type: string
      publish:
        description: Publish tested archives using the npm environment and trusted publishing
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build native ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/typescript
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            cross: --use-napi-cross
          - os: macos-15
            platform: darwin-arm64
            target: aarch64-apple-darwin
            cross: ""
          - os: windows-2025
            platform: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            cross: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: bindings/typescript/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Verify release versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --experimental-strip-types ../../scripts/release/check-version.ts
          if [ -n "$RELEASE_VERSION" ]; then
            node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.equal(JSON.parse(fs.readFileSync("package.json", "utf8")).version, process.env.RELEASE_VERSION)'
          fi
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build native release binding
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        # Locked @napi-rs/cross-toolchain 1.0.3 selects an immutable GCC/glibc
        # 2.17 sysroot on Linux instead of the runner's system glibc.
        run: >-
          pnpm exec napi build --platform --release --target ${{ matrix.target }}
          ${{ matrix.cross }} --output-dir . --js _native.cjs --dts _native.d.ts -- --locked
      - name: Verify Linux glibc requirement
        if: runner.os == 'Linux'
        run: pnpm release:check-glibc tokn_sdk.linux-x64-gnu.node
      - name: Check and test facade against native binding
        run: |
          pnpm check
          pnpm build:ts
          pnpm test
      - name: Upload native artifact and generated loader
        uses: actions/upload-artifact@v4
        with:
          name: npm-native-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            bindings/typescript/tokn_sdk.${{ matrix.platform }}.node
            bindings/typescript/_native.cjs

  assemble:
    name: Assemble npm archives
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: bindings/typescript/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-native-*
          path: bindings/typescript/artifacts
      - name: Pack facade and every platform archive
        run: pnpm release:pack artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: bindings/typescript/release/*
          if-no-files-found: error

  install-test:
    name: Install archives (${{ matrix.platform }}, Node ${{ matrix.node }}, Bun)
    needs: assemble
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64-gnu
            node: "22"
          - os: ubuntu-24.04
            platform: linux-x64-gnu
            node: "24"
          - os: macos-15
            platform: darwin-arm64
            node: "22"
          - os: windows-2025
            platform: win32-x64-msvc
            node: "22"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: bindings/typescript/release
      - name: Install and exercise exact release archives with npm and Bun
        run: node --experimental-strip-types scripts/release.ts test ${{ matrix.platform }}
        working-directory: bindings/typescript

  publish:
    name: Publish npm packages
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: install-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: bindings/typescript/release
      - name: Verify trusted publishing CLI support
        run: |
          node --input-type=module -e 'import { execFileSync } from "node:child_process"; import assert from "node:assert/strict"; const [major, minor, patch] = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number); assert(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), "Trusted publishing requires npm >=11.5.1")'
      - name: Publish verified native archives, then facade
        env:
          TOKN_NPM_PUBLISH: "1"
        run: node --experimental-strip-types scripts/release.ts publish
        working-directory: bindings/typescript

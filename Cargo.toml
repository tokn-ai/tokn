[workspace]
members = [
  "crates/tokn",
  "crates/mock-server",
  "crates/core",
  "crates/policy",
  "crates/config",
  "crates/legacy-config",
  "crates/agent-migration",
  "crates/auth",
  "crates/access",
  "crates/catalogue",
  "crates/convert",
  "crates/endpoint-core",
  "crates/endpoint-macros",
  "crates/endpoint-chat-completions",
  "crates/endpoint-responses",
  "crates/endpoint-messages",
  "crates/headers",
  "crates/router",
  "crates/service",
  "crates/sdk",
  "crates/requests",
  "crates/accounts",
  "crates/gateway-cli",
  "crates/persistence",
  "crates/provider-copilot",
  "crates/provider-deepseek",
  "crates/provider-llama-cpp",
  "crates/provider-openai",
  "crates/provider-opencode",
  "crates/provider-zai",
  "bindings/python",
  "bindings/typescript",
]
default-members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2021"
documentation = "https://docs.rs/tokn-router"
homepage = "https://github.com/tokn-ai/tokn"
repository = "https://github.com/tokn-ai/tokn"
license = "MIT"

[workspace.dependencies]
tokn = { version = "0.2.4", path = "crates/tokn" }
tokn-mock-server = { version = "0.2.4", path = "crates/mock-server" }
tokn-core = { version = "0.2.4", path = "crates/core", default-features = false }
tokn-policy = { version = "0.2.4", path = "crates/policy", default-features = false }
tokn-config = { package = "tokn-router-config", version = "0.2.4", path = "crates/config", default-features = false }
tokn-router-legacy-config = { version = "0.2.4", path = "crates/legacy-config" }
tokn-agent-migration = { version = "0.2.4", path = "crates/agent-migration" }
tokn-auth = { version = "0.2.4", path = "crates/auth", default-features = false }
tokn-access = { version = "0.2.4", path = "crates/access" }
tokn-catalogue = { version = "0.2.4", path = "crates/catalogue", default-features = false }
tokn-convert = { version = "0.2.4", path = "crates/convert", default-features = false }
tokn-endpoint-core = { version = "0.2.4", path = "crates/endpoint-core", default-features = false }
tokn-endpoint-macros = { version = "0.2.4", path = "crates/endpoint-macros" }
tokn-endpoint-chat-completions = { version = "0.2.4", path = "crates/endpoint-chat-completions", default-features = false }
tokn-endpoint-responses = { version = "0.2.4", path = "crates/endpoint-responses", default-features = false }
tokn-endpoint-messages = { version = "0.2.4", path = "crates/endpoint-messages", default-features = false }
tokn-headers = { version = "0.2.4", path = "crates/headers", default-features = false }
tokn-router = { version = "0.2.4", path = "crates/router" }
tokn-service = { version = "0.2.4", path = "crates/service", default-features = false }
tokn-sdk = { version = "0.2.4", path = "crates/sdk" }
tokn-requests = { version = "0.2.4", path = "crates/requests", default-features = false }
tokn-persistence = { version = "0.2.4", path = "crates/persistence" }
tokn-accounts = { version = "0.2.4", path = "crates/accounts", default-features = false }
tokn-provider-copilot = { version = "0.2.4", path = "crates/provider-copilot", default-features = false }
tokn-provider-deepseek = { version = "0.2.4", path = "crates/provider-deepseek", default-features = false }
tokn-provider-llama-cpp = { version = "0.2.4", path = "crates/provider-llama-cpp", default-features = false }
tokn-provider-openai = { version = "0.2.4", path = "crates/provider-openai", default-features = false }
tokn-provider-opencode = { version = "0.2.4", path = "crates/provider-opencode", default-features = false }
tokn-provider-zai = { version = "0.2.4", path = "crates/provider-zai", default-features = false }

anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
console = "0.16"
directories = "6"
eventsource-stream = "0.2"
futures = "0.3"
futures-util = "0.3"
flate2 = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
humantime = "2"
ipnet = "2"
indicatif = "0.18"
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
jsonc-parser = { version = "0.33", features = ["cst", "serde_json"] }
libc = "0.2"
notify = "8"
parking_lot = "0.12"
rcgen = { version = "0.14", features = ["crypto", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2", "socks", "gzip", "brotli", "deflate", "zstd", "form"] }
rustls-native-certs = "0.8"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
same-file = "1.0.6"
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
serde_yaml = "0.9"
sha2 = { version = "0.11", default-features = false }
subtle = "2"
smol_str = { version = "0.3", features = ["serde"] }
snafu = "0.9"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = { version = "1", default-features = false, features = ["serde"] }
toml_edit = "0.25"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "util"] }
thiserror = { version = "2", default-features = false }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
lzma-rust2 = "0.16.2"
zstd = "0.13"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.dev.package.lzma-rust2]
opt-level = 3

[profile.dev.package.zstd]
opt-level = 3

[profile.dev.package.zstd-safe]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

[profile.test.package.lzma-rust2]
opt-level = 3

[profile.test.package.zstd]
opt-level = 3

[profile.test.package.zstd-safe]
opt-level = 3

[profile.test.package.zstd-sys]
opt-level = 3

[package]
name = "tokn-desktop"
version = "0.2.4"
edition = "2021"
publish = false

[workspace]

[lib]
name = "tokn_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
toml_edit = "0.25"
sha2 = "0.10"
tokn-config = { package = "tokn-router-config", path = "../../../core/config" }
tokn-gateway = { package = "tokn-gateway-service", path = "../../../services/gateway" }
tokn-accounts = { path = "../../../services/accounts" }
tokn-auth = { path = "../../../core/auth" }
tokn-policy = { path = "../../../core/policy" }
tokn-viewer = { path = "../../../services/viewer" }

[dev-dependencies]
nix = { version = "0.30", features = ["signal"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
tokn-persistence = { path = "../../../services/persistence" }
url = "2"

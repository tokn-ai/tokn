[package]
name = "tokn-accounts"
version.workspace = true
edition.workspace = true
description = "Account pooling, affinity, and model route resolution across tokn providers"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["std"]
std = [
  "dep:anyhow",
  "dep:serde",
  "dep:tokio",
  "dep:toml",
  "dep:tokn-auth",
  "dep:tokn-config",
  "dep:arc-swap",
  "dep:parking_lot",
  "dep:reqwest",
  "dep:snafu",
  "dep:smol_str",
  "dep:tracing",
  "tokn-core/std",
  "tokn-policy/std",
  "tokn-config/std",
  "tokn-auth/std",
  "tokn-provider-copilot/std",
  "tokn-provider-deepseek/std",
  "tokn-provider-llama-cpp/std",
  "tokn-provider-openai/std",
  "tokn-provider-opencode/std",
  "tokn-provider-zai/std",
  "toml/std",
  "toml/parse",
  "toml/display",
]

[dependencies]
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tokn-core = { workspace = true }
tokn-auth = { workspace = true, optional = true }
tokn-config = { workspace = true, optional = true }
tokn-policy = { workspace = true }
tokn-provider-copilot = { workspace = true }
tokn-provider-deepseek = { workspace = true }
tokn-provider-llama-cpp = { workspace = true }
tokn-provider-openai = { workspace = true }
tokn-provider-opencode = { workspace = true }
tokn-provider-zai = { workspace = true }
arc-swap = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
snafu = { workspace = true, optional = true }
smol_str = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
async-trait = { workspace = true }

[[test]]
name = "v2_provider_pools"
required-features = ["std"]

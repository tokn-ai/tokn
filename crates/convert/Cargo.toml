[package]
name = "tokn-convert"
version.workspace = true
edition.workspace = true
description = "Request and response conversion pipeline across tokn endpoint formats"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["std"]
std = [
  "tokn-core/std",
  "tokn-endpoint-chat-completions/std",
  "tokn-endpoint-core/std",
  "tokn-endpoint-messages/std",
  "tokn-endpoint-responses/std",
  "dep:bytes",
  "dep:eventsource-stream",
  "dep:futures",
  "dep:futures-util",
  "dep:reqwest",
  "dep:tokio",
  "serde/std",
  "serde_json/std",
]

[dependencies]
tokn-core = { workspace = true, default-features = false }
bytes = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true
tokn-endpoint-chat-completions = { workspace = true }
tokn-endpoint-core = { workspace = true }
tokn-endpoint-messages = { workspace = true }
tokn-endpoint-responses = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
tokn-config = { workspace = true }
rusqlite = { workspace = true }

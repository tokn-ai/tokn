[package]
name = "tokn-sdk"
version.workspace = true
edition.workspace = true
description = "Rust SDK for configured LLM routing with standard and embedded platform services"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["std"]
# Standard filesystem, runtime, and HTTP adapters.
std = [
  "dep:anyhow",
  "dep:arc-swap",
  "dep:bytes",
  "dep:eventsource-stream",
  "dep:futures-util",
  "dep:smol_str",
  "dep:tokio",
  "tokn-auth/std",
  "tokn-config/std",
  "tokn-convert/std",
  "tokn-core/std",
  "tokn-headers/std",
  "tokn-requests/std",
  "tokn-service/std",
  "tokn-policy/std",
  "serde/std",
  "serde_json/std",
  "thiserror/std",
  "tokn-endpoint-chat-completions/std",
  "tokn-endpoint-messages/std",
  "tokn-endpoint-responses/std",
]

[dependencies]
anyhow = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
smol_str = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tokn-auth = { workspace = true, optional = true }
tokn-config.workspace = true
tokn-convert = { workspace = true, optional = true }
tokn-core.workspace = true
tokn-endpoint-chat-completions.workspace = true
tokn-endpoint-messages.workspace = true
tokn-endpoint-responses.workspace = true
tokn-headers.workspace = true
tokn-requests.workspace = true
tokn-service.workspace = true
tokn-policy.workspace = true

[dev-dependencies]
tempfile = "3"
tokn-mock-server.workspace = true

[[test]]
name = "client"
required-features = ["std"]

[[example]]
name = "chat"
required-features = ["std"]

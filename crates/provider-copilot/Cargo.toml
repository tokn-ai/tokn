[package]
name = "tokn-provider-copilot"
version.workspace = true
edition.workspace = true
description = "GitHub Copilot provider integration for tokn"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["std"]
std = [
  "tokn-core/std",
  "tokn-headers/std",
  "tokn-auth?/std",
  "tokn-catalogue?/std",
  "serde/std",
  "serde_json/std",
  "dep:tokn-auth",
  "dep:tokn-catalogue",
  "dep:async-trait",
  "dep:bytes",
  "dep:directories",
  "dep:reqwest",
  "dep:snafu",
  "dep:parking_lot",
  "dep:time",
  "dep:tokio",
  "dep:toml",
  "dep:tracing",
]

[dependencies]
tokn-core = { workspace = true, default-features = false }
tokn-auth = { workspace = true, optional = true }
tokn-catalogue = { workspace = true, optional = true }
tokn-headers = { workspace = true, default-features = false }
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokn-mock-server = { workspace = true }

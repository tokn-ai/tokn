[package]
name = "tokn-core"
version.workspace = true
edition.workspace = true
description = "Core types, traits, provider contracts, and shared utilities for tokn"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["std"]
std = [
  "dep:anyhow", "dep:async-trait", "dep:bytes", "dep:directories", "dep:http", "dep:reqwest",
  "dep:smol_str", "dep:url", "dep:toml", "dep:snafu", "dep:time", "dep:tokio", "dep:tracing",
  "serde/std", "serde/rc", "serde_json/std", "toml/std", "toml/parse", "toml/display", "url/std",
]

[dependencies]
async-trait = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true, optional = true }
sha2 = { workspace = true }
snafu = { workspace = true, optional = true }
time = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

url = { version = "2", default-features = false, optional = true }
toml_datetime = { version = "1", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
h2 = "0.4"

[[test]]
name = "version"
required-features = ["std"]

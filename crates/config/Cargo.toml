[package]
name = "tokn-router-config"
version.workspace = true
edition.workspace = true
description = "Configuration loading and path resolution for tokn"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "tokn_config"

[features]
default = ["std"]
std = [
  "tokn-core/std",
  "tokn-headers/std",
  "tokn-policy/std",
  "serde/std",
  "serde_json/std",
  "dep:toml",
  "dep:anyhow",
  "dep:reqwest",
  "dep:same-file",
  "dep:snafu",
  "dep:toml_edit",
  "dep:tracing",
  "dep:tempfile",
  "toml/std",
  "toml/parse",
  "toml/display",
]

[dependencies]
tokn-core = { workspace = true }
tokn-headers = { workspace = true }
tokn-policy = { workspace = true }
anyhow = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
same-file = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }

[[test]]
name = "v2_compile"
required-features = ["std"]

[[test]]
name = "v2_cors"
required-features = ["std"]

[[test]]
name = "v2_defaults"
required-features = ["std"]

[[test]]
name = "v2_profiles"
required-features = ["std"]

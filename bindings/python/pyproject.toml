[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "tokn-requests"
version = "0.2.4"
description = "Embedded Python SDK for routing LLM requests through tokn providers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "routing", "sdk", "tokn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tokn-ai/tokn"
Repository = "https://github.com/tokn-ai/tokn"
Issues = "https://github.com/tokn-ai/tokn/issues"

[tool.maturin]
module-name = "tokn_requests._native"
python-source = "python"
features = ["pyo3/extension-module"]
locked = true

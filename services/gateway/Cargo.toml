[package]
name = "tokn-gateway-service"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
description = "Tokn gateway orchestration, worker registration, and process supervision"

[features]
default = []
runtime = [
  "dep:tokn-access",
  "dep:tokn-config",
  "dep:tokn-core",
  "dep:tokn-maintenance",
  "dep:tokn-persistence",
  "dep:tokn-router",
  "dep:serde",
  "dep:serde_json",
  "dep:tracing",
  "dep:uuid",
]

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tokn-core = { workspace = true, features = ["std"], optional = true }
tokn-maintenance = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
tokn-access = { workspace = true, optional = true }
tokn-config = { workspace = true, features = ["std"], optional = true }
tokn-persistence = { workspace = true, optional = true }
tokn-router = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[target.'cfg(unix)'.dev-dependencies]
rusqlite = { workspace = true }
tempfile = "3"
tokn-headers = { workspace = true, features = ["std"] }
